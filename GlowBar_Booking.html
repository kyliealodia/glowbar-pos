<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Book an Appointment — Glow Bar</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --gold:#C9A84C;--gold-dk:#9C7A2C;--gold-lt:#F5EDD8;
    --ink:#2C2318;--ink2:#5C4F3D;--ink3:#9C8C78;--ink4:#C4B49A;
    --cream:#FAF7F2;--cream2:#F5EFE6;--cream3:#EDE3D4;
    --success:#3A7D52;--danger:#B84040;--warn:#A06820;
    --radius:16px;--shadow:0 8px 40px rgba(44,35,24,0.10);
  }
  body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--ink);min-height:100vh;min-height:-webkit-fill-available;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
html{height:-webkit-fill-available;}

  /* ── HERO ── */
  .hero{background:linear-gradient(160deg,#1A1410 0%,#2D2015 60%,#1A1410 100%);padding:48px 24px 36px;text-align:center;position:relative;overflow:hidden;}
  .hero::before{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(201,168,76,0.12) 0%,transparent 65%);top:-120px;left:50%;transform:translateX(-50%);pointer-events:none;}
  .hero-tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(201,168,76,0.6);margin-bottom:12px;}
  .hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,8vw,60px);font-weight:300;color:#E8C97A;line-height:1.1;margin-bottom:8px;}
  .hero-sub{font-size:13px;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase;}
  .hero-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.5),transparent);margin:20px auto;}

  /* ── STEPPER ── */
  .stepper{display:flex;justify-content:center;align-items:center;gap:0;padding:24px 16px 0;}
  .step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:120px;cursor:default;}
  .step-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--cream3);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink4);transition:all .3s;}
  .step.active .step-dot{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 0 0 4px rgba(201,168,76,0.15);}
  .step.done .step-dot{background:var(--success);border-color:var(--success);color:#fff;}
  .step-lbl{font-size:10px;color:var(--ink4);text-align:center;letter-spacing:0.5px;transition:color .3s;}
  .step.active .step-lbl{color:var(--gold-dk);font-weight:500;}
  .step.done .step-lbl{color:var(--success);}
  .step-line{flex:1;height:1px;background:var(--cream3);margin-top:-22px;max-width:40px;}
  .step.done + .step-line{background:var(--success);}

  /* ── CONTAINER ── */
  .container{max-width:560px;margin:0 auto;padding:24px 16px 60px;}

  /* ── CARDS ── */
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-bottom:16px;}
  .card-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;margin-bottom:6px;}
  .card-sub{font-size:12px;color:var(--ink3);margin-bottom:20px;}

  /* ── FORM ── */
  .form-group{margin-bottom:16px;}
  .form-label{display:block;font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
  .form-input,.form-select,.form-textarea{width:100%;padding:12px 14px;border:1.5px solid var(--cream3);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);outline:none;transition:border-color .2s;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--gold);}
  .form-textarea{min-height:80px;resize:vertical;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ── SERVICE GRID ── */
  .svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .svc-btn{padding:14px 12px;border:1.5px solid var(--cream3);border-radius:12px;background:var(--cream);cursor:pointer;text-align:left;transition:all .2s;font-family:'DM Sans',sans-serif;}
  .svc-btn:hover{border-color:var(--gold);background:var(--gold-lt);}
  .svc-btn.sel{border-color:var(--gold);background:var(--gold-lt);box-shadow:0 0 0 3px rgba(201,168,76,0.15);}
  .svc-btn.sel .svc-name{color:var(--gold-dk);}
  .svc-name{font-size:13px;font-weight:500;color:var(--ink);display:block;margin-bottom:3px;}
  .svc-desc{font-size:11px;color:var(--ink3);display:block;margin-bottom:4px;line-height:1.4;font-weight:300;}
  .svc-price{font-size:12px;color:var(--gold-dk);font-weight:600;}
  .save-badge{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:linear-gradient(135deg,#fef9ec,#fdf0c8);color:var(--gold-dk);border:1px solid var(--gold);}
  .pay-terms{display:block;margin-top:5px;font-size:10px;color:var(--ink3);font-style:italic;line-height:1.4;}
  .svc-cat{font-size:10px;color:var(--ink4);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;}

  /* ── TIME SLOTS ── */
  .slots-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
  .slot-btn{padding:10px 6px;border:1.5px solid var(--cream3);border-radius:9px;background:var(--cream);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--ink2);transition:all .2s;text-align:center;}
  .slot-btn:hover{border-color:var(--gold);}
  .slot-btn.sel{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600;}
  .slot-btn.taken{opacity:0.35;cursor:not-allowed;text-decoration:line-through;}

  /* ── DATE PICKER ── */
  .date-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;}
  .date-day-hdr{font-size:10px;color:var(--ink4);text-align:center;padding:4px 0;text-transform:uppercase;}
  .date-btn{padding:8px 4px;border:1.5px solid transparent;border-radius:8px;background:transparent;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--ink2);text-align:center;transition:all .2s;}
  .date-btn:hover:not(.past):not(.empty){border-color:var(--gold);background:var(--gold-lt);}
  .date-btn.sel{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600;}
  .date-btn.today{color:var(--gold-dk);font-weight:700;}
  .date-btn.past{opacity:0.3;cursor:not-allowed;}
  .date-btn.empty{cursor:default;}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-nav-btn{background:none;border:1px solid var(--cream3);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--ink2);}
  .cal-month{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;}

  /* ── STAFF ── */
  .staff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;}
  .staff-btn{padding:14px 10px;border:1.5px solid var(--cream3);border-radius:12px;background:var(--cream);cursor:pointer;text-align:center;transition:all .2s;font-family:'DM Sans',sans-serif;}
  .staff-btn:hover{border-color:var(--gold);}
  .staff-btn.sel{border-color:var(--gold);background:var(--gold-lt);}
  .staff-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin:0 auto 8px;}
  .staff-name{font-size:12px;font-weight:500;color:var(--ink);}
  .staff-role{font-size:10px;color:var(--ink4);}

  /* ── SUMMARY ── */
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--cream3);font-size:13px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-lbl{color:var(--ink3);}
  .summary-val{font-weight:500;color:var(--ink);}

  /* ── BUTTONS ── */
  .btn-gold{width:100%;padding:16px;background:linear-gradient(135deg,#C9A84C,#B8935A);color:#fff;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.5px;transition:all .2s;margin-top:8px;}
  .btn-gold:hover{background:linear-gradient(135deg,#B8935A,#9C7A2C);}
  .btn-gold:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-outline{width:100%;padding:14px;background:transparent;color:var(--ink2);border:1.5px solid var(--cream3);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;margin-top:8px;transition:all .2s;}
  .btn-outline:hover{border-color:var(--gold);}

  /* ── SUCCESS ── */
  .success-wrap{text-align:center;padding:40px 20px;}
  .success-icon{font-size:56px;margin-bottom:16px;}
  .success-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;color:var(--gold-dk);margin-bottom:8px;}
  .success-msg{font-size:14px;color:var(--ink3);line-height:1.7;margin-bottom:24px;}
  .booking-ref{background:var(--gold-lt);border:1px solid rgba(201,168,76,0.3);border-radius:10px;padding:14px 18px;font-size:13px;color:var(--ink2);margin-bottom:20px;}
  .booking-ref strong{color:var(--gold-dk);}

  /* ── LOADING / ERROR ── */
  .loading-wrap{text-align:center;padding:60px 20px;color:var(--ink3);}
  .spinner{width:36px;height:36px;border:3px solid var(--cream3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{background:rgba(180,60,60,0.07);border:1px solid rgba(180,60,60,0.2);border-radius:12px;padding:16px;color:var(--danger);font-size:13px;margin-bottom:16px;}

  /* ── NOTICE ── */
  .notice{background:var(--gold-lt);border:1px solid rgba(201,168,76,0.3);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--ink2);margin-bottom:16px;line-height:1.6;}

  /* ── CATEGORY DROPDOWN ── */
  .cat-select-wrap{position:relative;margin-bottom:20px;}
  .cat-select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gold-dk);pointer-events:none;font-size:15px;font-weight:700;}
  .cat-select{width:100%;padding:12px 40px 12px 16px;border:1.5px solid var(--gold);border-radius:12px;background:var(--gold-lt);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;transition:border-color .2s;}
  .cat-select:focus{border-color:var(--gold-dk);box-shadow:0 0 0 3px rgba(201,168,76,0.15);}
  .subcat-hdr{font-size:10px;color:var(--ink4);text-transform:uppercase;letter-spacing:1px;padding:12px 0 6px;font-weight:600;border-top:1px solid var(--cream2);margin-top:12px;}
  .subcat-hdr:first-child{border-top:none;margin-top:0;padding-top:0;}
  .date-btn.closed{background:#fff0f0;color:var(--danger);opacity:0.55;cursor:not-allowed;}
  .date-btn.far{opacity:0.25;cursor:not-allowed;}

  /* ── Tablet ── */
  @media(max-width:768px){
    .container{padding:16px 12px 48px;}
    .slot-btn{min-height:44px;padding:8px 4px;}
    .cal-nav-btn{width:40px;height:40px;}
    .form-row{grid-template-columns:1fr;}
    input,select,textarea{font-size:16px;}
  }
  /* ── Mobile ── */
  @media(max-width:480px){
    .svc-grid{grid-template-columns:1fr;}
    .slots-grid{grid-template-columns:repeat(3,1fr);}
    .staff-grid{grid-template-columns:repeat(2,1fr);}
    .form-row{grid-template-columns:1fr;}
    .hero-title{font-size:clamp(32px,9vw,48px);}
  }
</style>

function getCatTabId(p){

function getPkgTabId(pkg){
  const n=(pkg.name||'').toLowerCase();
  // Combo packages use ' + ' (spaces) between service types; '10+2' has no spaces
  if(n.includes(' + ')&&(n.includes('diode')||n.includes('carbon')||n.includes('pico'))) return 'rejuv';
  if(n.includes('diode')) return 'diode';
  if(n.includes('rejuven')||n.includes('rejuve')) return 'rejuv';
  if(n.includes('exilis')) return 'exilis';
  if(n.includes('carbon')||n.includes('black doll')||n.includes('melasma')||n.includes('scar')) return 'pico';
  if(n.includes('tattoo')) return 'tattoo';
  return null;
}

function isComboBooking(){

  const hasMachineFacial=types.some(t=>t==='laser'||t==='facial');

}

async function loadData(){
  // Ensure anonymous auth token is ready before reading protected Firebase paths
  if(db && !firebase.auth().currentUser){
    try{ await firebase.auth().signInAnonymously(); }catch(e){}
  }
  // Safety timeout — if Firebase takes more than 6 seconds, use demo data
  const timeout = new Promise(resolve=>setTimeout(()=>resolve('timeout'), 6000));

  if(!db){
    DATA.products = DEMO_DATA.products;
    DATA.packages  = DEMO_DATA.packages;
    DATA.users     = DEMO_DATA.users;
    DATA.bookings  = DEMO_DATA.bookings;
    showStep1();
    return;
  }

  try{
    const result = await Promise.race([
      db.ref('gb').once('value'),
      timeout
    ]);

    if(result === 'timeout'){
      // Firebase too slow — use demo data
      DATA.products = DEMO_DATA.products;
      DATA.packages  = DEMO_DATA.packages;
      DATA.users     = DEMO_DATA.users;
      DATA.bookings  = [];
      showStep1();
      return;
    }

    const d = result.val()||{};

    // Handle both array and object formats from Firebase
    function toArray(val){ if(!val) return null; if(Array.isArray(val)) return val.filter(Boolean); return Object.values(val).filter(Boolean); }

    // Use lightweight serviceNames if available, fall back to full products, then demo
    // Merge cost from gb/products into serviceNames so profit calc works
    const serviceNames = toArray(d.serviceNames);
    const fullProds = toArray(d.products);
    const prods = serviceNames && serviceNames.length
      ? serviceNames.map(s=>{ const p=fullProds?.find(x=>x.id===s.id||String(x.id)===String(s.id)); return p?.cost!=null?{...s,cost:p.cost}:s; })
      : fullProds;
    const pkgs  = toArray(d.packages);
    const users = toArray(d.users);
    const bkgs  = toArray(d.bookings);

    DATA.products = prods && prods.length ? prods : DEMO_DATA.products;
    DATA.packages = pkgs  && pkgs.length  ? pkgs  : DEMO_DATA.packages;
    DATA.users    = users && users.length ? users : DEMO_DATA.users;
    DATA.bookings = bkgs  || [];
    DATA.settings = d.settings && typeof d.settings==='object' && !Array.isArray(d.settings) ? d.settings : DATA.settings;

    showStep1();
  } catch(e){
    DATA.products = DEMO_DATA.products;
    DATA.packages = DEMO_DATA.packages;
    DATA.users    = DEMO_DATA.users;
    DATA.bookings = [];
    // Keep default settings — don't set null
    showStep1();
  }
}

function selectCat(tabId){

function selectService(id, name, price, durationMins){
  const idx=booking.services.findIndex(s=>s.id===id);
  if(idx>=0){
    booking.services.splice(idx,1);
  } else {
    booking.services.push({id,name,price,durationMins:durationMins||60});
  }
  booking.service=booking.services.map(s=>s.name).join(', ');
  booking.servicePrice=booking.services.reduce((t,s)=>t+s.price,0);
  booking.serviceId=booking.services.length===1?booking.services[0].id:null;
  booking.duration=Math.max(booking.services.reduce((t,s)=>t+(s.durationMins||60),0),30);
  showStep1();
}

function removeService(id){
  booking.services=booking.services.filter(s=>s.id!==id);
  booking.service=booking.services.map(s=>s.name).join(', ');
  booking.servicePrice=booking.services.reduce((t,s)=>t+s.price,0);
  booking.duration=Math.max(booking.services.reduce((t,s)=>t+(s.durationMins||60),0),30);
  showStep1();
}

function calNav(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCal();
}

function renderCal(){
  const label=document.getElementById('calMonthLabel');
  const grid=document.getElementById('calGrid');
  if(!label||!grid)return;
  const d=new Date(calYear,calMonth,1);
  label.textContent=d.toLocaleDateString('en-PH',{month:'long',year:'numeric'});
  const days=['Su','Mo','Tu','We','Th','Fr','Sa'];
  let html=days.map(d=>`<div class="date-day-hdr">${d}</div>`).join('');
  const firstDay=d.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  const cfg=DATA.settings||{};
  const openDays=cfg.openDays||[1,2,3,4,5,6];
  const closedDates=cfg.closedDates||[]; // ['YYYY-MM-DD',...]
  const bookingWindowDays=cfg.bookingWindowDays||365;
  const maxDate=new Date(today); maxDate.setDate(maxDate.getDate()+bookingWindowDays);
  for(let i=0;i<firstDay;i++) html+=`<button class="date-btn empty"> </button>`;
  for(let i=1;i<=daysInMonth;i++){
    const dt=new Date(calYear,calMonth,i);
    const ds=dt.toISOString().split('T')[0];
    const isPast=dt<today;
    const isTooFar=dt>maxDate;
    const isWeekdayClosed=!openDays.includes(dt.getDay());
    const isClosedDate=closedDates.includes(ds);
    const isTod=dt.toDateString()===today.toDateString();
    const isSel=booking.date===ds;
    const disabled=isPast||isTooFar||isWeekdayClosed||isClosedDate;
    const clickFn=disabled?'':`pickDate('${ds}')`;
    let cls=`date-btn${isPast||isTooFar?' past':isClosedDate?' closed':isWeekdayClosed?' past':''}${isTod?' today':''}${isSel?' sel':''}`;
    let title=isClosedDate?'Closed — Holiday/Rest day':isWeekdayClosed?'Closed':isTooFar?'Outside booking window':'Available';
    html+=`<button class="${cls}" onclick="${clickFn}" title="${title}">${i}${isClosedDate?'<br><span style=\'font-size:7px;color:#B84040;\'>✕</span>':isWeekdayClosed?'<br><span style=\'font-size:7px;color:#B84040;\'>✕</span>':''}</button>`;
  }
  grid.innerHTML=html;
}

function pickDate(ds){
  booking.date=ds; booking.time='';
  renderCal();
  const timeCard=document.getElementById('timeCard');
  const staffCard=document.getElementById('staffCard');
  if(timeCard) timeCard.style.display='block';
  if(staffCard) staffCard.style.display='none';
  const sub=document.getElementById('timeSub');
  if(sub){
    const d=new Date(ds+'T00:00');
    sub.innerHTML=`Available slots for <strong>${d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric'})}</strong>`;
  }
  renderSlots(ds);
  const btn=document.getElementById('step2next');
  if(btn) btn.setAttribute('disabled','');
  // Show surge notice and update service price if this date has holiday/surge pricing
  const surge=((DATA.settings||{}).surgeDates||{})[ds];
  const surgeEl=document.getElementById('surgeNote');
  const basePrice=booking.services.reduce((t,s)=>t+s.price,0);
  booking.servicePrice=surge?Math.round(basePrice*(1+surge.pct/100)*100)/100:basePrice;
  if(surgeEl){
    if(surge){
      surgeEl.style.display='block';
      surgeEl.innerHTML=`⚡ <strong>${surge.label||'Surge'} pricing</strong> applies on this date — a <strong>+${surge.pct}%</strong> surcharge is included in the price shown.`;
    } else {
      surgeEl.style.display='none';
    }
  }
}

function toMins(t){ var p=(t||'00:00').split(':'); return parseInt(p[0])*60+parseInt(p[1]); }

function getSvcMeta(svcName,svcCat){
  var n=(svcName||'').toLowerCase(), c=(svcCat||'').toLowerCase();
  if(c.indexOf('body contouring')>=0||c.indexOf('exilis')>=0||c.indexOf('pico')>=0||c.indexOf('diode')>=0||
     c.indexOf('laser')>=0||c.indexOf('glow skin')>=0||c.indexOf('glow ink')>=0||c.indexOf('glow clear')>=0||
     n.indexOf('exilis')>=0||n.indexOf('diode')>=0||n.indexOf('laser')>=0||n.indexOf('carbon')>=0||
     n.indexOf('tattoo')>=0||n.indexOf('wart')>=0||n.indexOf('pico')>=0||n.indexOf('melasma')>=0||n.indexOf('scar')>=0||
     n.indexOf('rejuvenation')>=0||n.indexOf('rejuve')>=0)
    return{type:'laser',buffer:15};
  if(c.indexOf('facial')>=0||n.indexOf('facial')>=0||n.indexOf('hydra')>=0)
    return{type:'facial',buffer:15};
  if(c.indexOf('nail')>=0||n.indexOf('mani')>=0||n.indexOf('pedi')>=0||n.indexOf('nail art')>=0||
     n.indexOf('extension')>=0||n.indexOf('polygel')>=0||n.indexOf('softgel')>=0)
    return{type:'nail',buffer:10};
  if(c.indexOf('wax')>=0||c.indexOf('hair wax')>=0||n.indexOf('wax')>=0||n.indexOf('brazilian')>=0||n.indexOf('bikini')>=0)
    return{type:'wax',buffer:10};
  return{type:'standard',buffer:10};
}

function getDataTypeCap(type,dateStr,timeStr){
  var cfg=DATA.settings||{};
  var maxStaff=cfg.maxStaff||2;
  if(type==='laser'||type==='facial') return 1;
  if(type==='nail'){
    var pt=cfg.partTimer||{};
    if(!pt.name) return maxStaff;
    var day=new Date((dateStr||'2000-01-01')+'T12:00').getDay();
    var ptAvailableDay=(pt.workDays||[]).indexOf(day)>=0;
    if(!ptAvailableDay) return maxStaff;
    // Check time falls within part-timer hours
    if(timeStr){
      var ptStart=pt.startTime||'09:00';
      var ptEnd=pt.endTime||'17:00';
      if(timeStr<ptStart||timeStr>=ptEnd) return maxStaff;
    }
    return maxStaff+1;
  }
  return maxStaff;
}

function renderSlots(date){
  var cfg=DATA.settings||{};
  var openTime=cfg.openTime||'09:00';
  var closeTime=cfg.closeTime||'19:00';
  var slotDur=parseInt(cfg.slotDuration)||60;
  var breakStart=cfg.breakStart||'';
  var breakEnd=cfg.breakEnd||'';

  var svcName=booking.service||'';
  var svcDur=booking.duration||60;
  var meta=getSvcMeta(svcName);
  var cap=getDataTypeCap(meta.type,date);

  var slots=[];
  var parts=openTime.split(':');
  var h=parseInt(parts[0]),m=parseInt(parts[1]);
  var cparts=closeTime.split(':');
  var ch=parseInt(cparts[0]),cm=parseInt(cparts[1]);
  while(h*60+m<ch*60+cm){
    var t=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    var inBreak=breakStart&&breakEnd&&t>=breakStart&&t<breakEnd;
    if(!inBreak) slots.push(t);
    m+=slotDur; if(m>=60){h+=Math.floor(m/60);m=m%60;}
  }

  var grid=document.getElementById('slotsGrid');
  if(!grid) return;
  if(!slots.length){grid.innerHTML='<div style="padding:20px;text-align:center;color:#9C8C78;">No available slots for this day.</div>';return;}

  function countOverlap(slotTime){
    var newStart=toMins(slotTime);
    var newEnd=newStart+svcDur+meta.buffer;
    return DATA.bookings.reduce(function(sum,b){
      if(b.date!==date||b.status==='cancelled'||b.status==='no-show') return sum;
      var bMeta=getSvcMeta(b.service||'');
      if(bMeta.type!==meta.type) return sum;
      var bStart=toMins(b.time||'00:00');
      var bEnd=bStart+(b.duration||60)+bMeta.buffer;
      if(newStart<bEnd&&newEnd>bStart) return sum+(b.groupSize||1);
      return sum;
    },0);
  }

  var isSingleResource=meta.type==='laser'||meta.type==='facial';
  var firstFullIdx=-1;

  var grpSize=booking.groupSize||1;

  var html='';
  slots.forEach(function(t,idx){
    var slotCap=getDataTypeCap(meta.type,date,t);
    var active=countOverlap(t);
    var isFull=active+grpSize>slotCap;
    var isSel=booking.time===t;
    var spotsLeft=slotCap-active;
    var cls='slot-btn'+(isFull?' taken':'')+(isSel?' sel':'');
    var sub=isFull?'Full':(active>0?spotsLeft+' left':'');
    var subHtml=sub?'<br><span style="font-size:9px;opacity:.8;">'+sub+'</span>':'';
    var onclick=isFull?'':'selectTime(\''+t+'\')';
    if(isFull&&isSingleResource&&firstFullIdx<0) firstFullIdx=idx;
    html+='<button class="'+cls+'" onclick="'+onclick+'">'+t+subHtml+'</button>';
  });

  // For machine/facial bed: show "next available" banner if any slot is full for this group
  var nextNote='';
  if(isSingleResource&&firstFullIdx>=0){
    var nextAvail=null;
    for(var i=0;i<slots.length;i++){
      if(countOverlap(slots[i])+grpSize<=getDataTypeCap(meta.type,date,slots[i])){nextAvail=slots[i];break;}
    }
    if(nextAvail) nextNote='<div style="font-size:11px;color:#b45309;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;margin-bottom:8px;">⚡ Machine/bed in use for some slots — next open slot: <strong>'+nextAvail+'</strong></div>';
  }

  grid.innerHTML=nextNote+html;
}

function selectTime(t){
  booking.time=t;
  renderSlots(booking.date);
  const staffCard=document.getElementById('staffCard');
  if(staffCard) staffCard.style.display='block';
  const btn=document.getElementById('step2next');
  if(btn) btn.removeAttribute('disabled');
}

function selectStaff(type, name, color, role){
  if(type==='aesthetician'){
    booking.aesthetician=name; booking.staff=name; booking.staffColor=color;
    // Only deselect buttons in the aesthetician group (first staff-grid)
    const grids=document.querySelectorAll('.staff-grid');
    if(grids[0]) grids[0].querySelectorAll('.staff-btn').forEach(b=>b.classList.remove('sel'));
  } else if(type==='nailtech'){
    booking.nailTech=name;
    const grids=document.querySelectorAll('.staff-grid');
    if(grids[1]) grids[1].querySelectorAll('.staff-btn').forEach(b=>b.classList.remove('sel'));
  } else {
    booking.staff=name; booking.staffColor=color; booking.aesthetician=''; booking.nailTech='';
    document.querySelectorAll('.staff-btn').forEach(b=>b.classList.remove('sel'));
  }
  event.currentTarget.classList.add('sel');
}

// ── STEP 3: DETAILS ──
function goStep3(){
  if(!booking.date||!booking.time)return;
  setStep(3);
  const d=new Date(booking.date+'T00:00');
  const dateStr=d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  show(`<div class="card">
    <div class="card-title">Your Details</div>
    <div class="card-sub">We need a few details to confirm your booking.</div>
    <div class="form-group"><label class="form-label">Full Name *</label><input class="form-input" id="bkName" placeholder="Your full name" value="${booking.name}" oninput="booking.name=this.value;updateStep3Btn()"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Phone Number *</label><input class="form-input" id="bkPhone" type="tel" placeholder="09xx xxx xxxx" value="${booking.phone}" oninput="booking.phone=this.value;updateStep3Btn()"></div>
      <div class="form-group"><label class="form-label">Email (optional)</label><input class="form-input" id="bkEmail" type="email" placeholder="your@email.com" value="${booking.email}" oninput="booking.email=this.value"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Group Booking <span style="font-size:10px;color:#9C8C78;">(how many clients together?)</span></label>
      <div style="display:flex;align-items:center;gap:10px;">
        <input class="form-input" type="number" id="bkGroupSize" min="1" max="10" value="${booking.groupSize||1}" style="width:80px;" oninput="booking.groupSize=parseInt(this.value)||1">
        <span style="font-size:12px;color:#9C8C78;">client${booking.groupSize>1?'s':''} — leave 1 for solo</span>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Special Requests / Notes</label><textarea class="form-textarea" id="bkNotes" placeholder="Allergies, preferences, questions…" oninput="booking.notes=this.value">${booking.notes}</textarea></div>
    <div class="notice">📅 You're booking <strong>${booking.services.map(s=>s.name).join(', ')}</strong> on <strong>${dateStr}</strong> at <strong>${booking.time}</strong>${isComboBooking()?(booking.aesthetician||booking.nailTech?' — Aesthetician: <strong>'+(booking.aesthetician||'Any')+'</strong>, Nail Tech: <strong>'+(booking.nailTech||'Any')+'</strong>':''):booking.staff?' with <strong>'+booking.staff+'</strong>':''}.</div>
    <button class="btn-gold" onclick="goStep4()" ${booking.name&&booking.phone?'':'disabled'} id="step3next">Review Booking →</button>
    <button class="btn-outline" onclick="goStep2()">← Back</button>
  </div>`);
}

function updateStep3Btn(){
  const btn=document.getElementById('step3next');
  if(btn){
    const ok=booking.name.trim()&&booking.phone.trim();
    if(ok) btn.removeAttribute('disabled'); else btn.setAttribute('disabled','');
  }
}

// ── STEP 4: CONFIRM ──
function goStep4(){
  if(!booking.name||!booking.phone)return;
  setStep(4);
  const d=new Date(booking.date+'T00:00');
  const dateStr=d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  show(`<div class="card">
    <div class="card-title">Confirm Your Booking</div>
    <div class="card-sub">Please review the details below before confirming.</div>
    <div class="summary-row"><span class="summary-lbl">Service${booking.services.length>1?'s':''}</span><span class="summary-val">${booking.services.map(s=>`${s.name} — ${fmtPrice(s.price)}`).join('<br>')}</span></div>
    <div class="summary-row"><span class="summary-lbl">Total</span><span class="summary-val" style="color:var(--gold-dk);font-weight:600;">${fmtPrice(booking.servicePrice)}</span></div>
    <div class="summary-row"><span class="summary-lbl">Date</span><span class="summary-val">${dateStr}</span></div>
    <div class="summary-row"><span class="summary-lbl">Time</span><span class="summary-val">${booking.time}${booking.duration?' ('+booking.duration+' min)':''}</span></div>
    ${booking.groupSize>1?`<div class="summary-row"><span class="summary-lbl">Group</span><span class="summary-val">👥 ${booking.groupSize} clients</span></div>`:''}
    ${isComboBooking()?
      `<div class="summary-row"><span class="summary-lbl">Aesthetician</span><span class="summary-val">${booking.aesthetician||'No preference'}</span></div>
       <div class="summary-row"><span class="summary-lbl">Nail Tech</span><span class="summary-val">${booking.nailTech||'No preference'}</span></div>`
      :`<div class="summary-row"><span class="summary-lbl">Provider</span><span class="summary-val">${booking.staff||'No preference'}</span></div>`}
    <div class="summary-row"><span class="summary-lbl">Name</span><span class="summary-val">${booking.name}</span></div>
    <div class="summary-row"><span class="summary-lbl">Phone</span><span class="summary-val">${booking.phone}</span></div>
    ${booking.email?`<div class="summary-row"><span class="summary-lbl">Email</span><span class="summary-val">${booking.email}</span></div>`:''}
    ${booking.notes?`<div class="summary-row"><span class="summary-lbl">Notes</span><span class="summary-val">${booking.notes}</span></div>`:''}
    <div class="notice" style="margin-top:16px;">📞 We will confirm your appointment via call or message. If you need to reschedule, please contact us at least 24 hours before your booking.</div>
    <button class="btn-gold" onclick="submitBooking()" id="confirmBtn">✓ Confirm Booking</button>
    <button class="btn-outline" onclick="goStep3()">← Back</button>
  </div>`);
}

// ── SUBMIT ──
async function submitBooking(){
  const btn=document.getElementById('confirmBtn');
  if(btn){btn.disabled=true;btn.textContent='Submitting…';}

  // Safety timeout — show success after 8 seconds regardless
  const timeout=setTimeout(()=>{showSuccess(ref);sendConfirmationEmail({...appt,client:booking.name,name:booking.name},ref);},8000);

  const ref=uid('BK');
  const svcMeta=getSvcMeta(booking.service||'');
  const combo=isComboBooking();
  const appt={
    id:Date.now(),
    client:booking.name,
    phone:booking.phone,
    email:booking.email||'',
    service:booking.service,
    services:booking.services,
    totalPrice:booking.servicePrice,
    staff:booking.staff||'',
    aesthetician:combo?(booking.aesthetician||''):undefined,
    nailTech:combo?(booking.nailTech||''):undefined,
    date:booking.date,
    time:booking.time,
    duration:booking.duration||60,
    serviceType:svcMeta.type,
    groupSize:booking.groupSize||1,
    source:'online',
    status:'pending',
    notes:booking.notes||'',
    reminder:true,
    ref,
    createdAt:new Date().toISOString()
  };
  try{
    if(db){
      // Use Firebase push() — generates unique key, never collides, works regardless of array/object format
      await db.ref('gb/bookings').push(appt);
    }
    clearTimeout(timeout);
    showSuccess(ref);
    sendConfirmationEmail({...appt, client: booking.name, name: booking.name}, ref);
  }catch(e){
    console.error('Booking error:',e);
    clearTimeout(timeout);
    showSuccess(ref);
    sendConfirmationEmail({...appt, client: booking.name, name: booking.name}, ref);
  }
}

function showSuccess(ref){
  const d=new Date(booking.date+'T00:00');
  const dateStr=d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  [1,2,3,4].forEach(i=>{
    const el=document.getElementById('step'+i);
    el.classList.remove('active');
    el.classList.add('done');
  });
  show(`<div class="card">
    <div class="success-wrap">
      <div class="success-icon">🌸</div>
      <div class="success-title">You're All Set!</div>
      <div class="success-msg">Your appointment request has been received. We'll confirm your booking via call or message shortly.</div>
      <div class="booking-ref">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink4);margin-bottom:6px;">Booking Reference</div>
        <div style="font-size:20px;font-weight:700;color:var(--gold-dk);letter-spacing:2px;">${ref}</div>
      </div>
      <div class="summary-row" style="text-align:left;"><span class="summary-lbl">Service${booking.services.length>1?'s':''}</span><span class="summary-val">${booking.services.map(s=>s.name).join(', ')}</span></div>
      <div class="summary-row" style="text-align:left;"><span class="summary-lbl">Total</span><span class="summary-val" style="color:var(--gold-dk);font-weight:600;">${fmtPrice(booking.servicePrice)}</span></div>
      <div class="summary-row" style="text-align:left;"><span class="summary-lbl">Date</span><span class="summary-val">${dateStr}</span></div>
      <div class="summary-row" style="text-align:left;"><span class="summary-lbl">Time</span><span class="summary-val">${booking.time}</span></div>
      ${isComboBooking()
        ?`${booking.aesthetician?`<div class="summary-row" style="text-align:left;"><span class="summary-lbl">Aesthetician</span><span class="summary-val">${booking.aesthetician}</span></div>`:''}
          ${booking.nailTech?`<div class="summary-row" style="text-align:left;"><span class="summary-lbl">Nail Tech</span><span class="summary-val">${booking.nailTech}</span></div>`:''}`
        :booking.staff?`<div class="summary-row" style="text-align:left;"><span class="summary-lbl">Provider</span><span class="summary-val">${booking.staff}</span></div>`:''}
      <button class="btn-gold" style="margin-top:24px;" onclick="location.reload()">Book Another Appointment</button>
    </div>
  </div>`);
}

async function sendConfirmationEmail(appt, ref){
  if(!appt.email) return;
  if(EMAILJS_PUBLIC_KEY==='YOUR_EMAILJS_PUBLIC_KEY') return;
  try {
    const d = new Date(appt.date+'T00:00');
    const dateStr = d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    const total = appt.totalPrice||appt.servicePrice||0;
    const deposit = appt.depositAmt||0;
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      email:            appt.email,
      client_name:      appt.client || appt.name,
      service_name:     appt.service,
      appointment_date: dateStr,
      appointment_time: appt.time,
      deposit_amount:   deposit > 0 ? '₱' + deposit.toLocaleString() : '—',
      balance_due:      '₱' + Math.max(0, total - deposit).toLocaleString(),
    });
    console.log('Confirmation email sent to', appt.email);
  } catch(e) {
    console.warn('Email send failed:', e);
  }
}

// ── INIT ──
loadData();
</script>
