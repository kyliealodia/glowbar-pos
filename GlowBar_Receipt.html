<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlowBar Receipt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f0eb;min-height:100vh;font-family:'Jost',sans-serif;color:#2a2218;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;}
.receipt-wrap{background:#fff;border-radius:16px;max-width:480px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.10);overflow:hidden;}
.receipt-header{width:100%;display:block;position:relative;}
.receipt-header img{width:100%;display:block;max-height:120px;object-fit:cover;}
.receipt-header-fallback{display:none;padding:18px 0;text-align:center;font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:#2a2218;background:#faf7f3;letter-spacing:1px;}
.receipt-body{padding:28px 28px 20px;}
.brand{text-align:center;margin-bottom:20px;}
.brand h1{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;letter-spacing:1px;color:#2a2218;}
.brand .tagline{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8a7a6a;margin-top:2px;}
.receipt-num{text-align:center;margin-bottom:20px;}
.receipt-num .rnum{font-size:13px;font-weight:600;color:#5a4a3a;letter-spacing:.5px;}
.receipt-num .rdate{font-size:11px;color:#8a7a6a;margin-top:3px;}
.divider{border:none;border-top:1px dashed #d4c9bc;margin:16px 0;}
.section-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a6a;margin-bottom:10px;font-weight:600;}
.row{display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;margin-bottom:8px;gap:12px;}
.row .label{color:#6a5a4a;flex-shrink:0;}
.row .value{font-weight:500;text-align:right;color:#2a2218;}
.row .value.accent{color:#b5831a;}
.row .value.danger{color:#c0392b;}
.row .value.success{color:#27ae60;}
.svc-item{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #f0ebe4;}
.svc-item:last-child{border-bottom:none;}
.svc-name{color:#2a2218;font-weight:500;}
.svc-price{color:#5a4a3a;white-space:nowrap;}
.total-row{display:flex;justify-content:space-between;font-size:16px;font-weight:700;padding:12px 0 4px;border-top:2px solid #d4c9bc;margin-top:8px;}
.total-row .total-label{color:#2a2218;}
.total-row .total-val{color:#b5831a;}
.badge{display:inline-block;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.badge-method{background:#f0ebe4;color:#5a4a3a;}
.badge-pkg{background:#eaf4ec;color:#27ae60;}
.badge-installment{background:#fff8ec;color:#b5831a;}
.info-box{background:#faf7f3;border-radius:10px;padding:14px 16px;margin-top:14px;font-size:12px;line-height:1.7;color:#5a4a3a;}
.info-box strong{color:#2a2218;}
.balance-box{background:#fff8ec;border:1.5px solid #f0c060;border-radius:10px;padding:14px 16px;margin-top:12px;}
.balance-box .bal-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a6a;margin-bottom:6px;font-weight:600;}
.balance-box .bal-amount{font-size:20px;font-weight:700;color:#b5831a;}
.balance-box .bal-next{font-size:11px;color:#6a5a4a;margin-top:4px;}
.installment-box{background:#f0f7ff;border:1.5px solid #a8c8e8;border-radius:10px;padding:14px 16px;margin-top:12px;}
.installment-box .inst-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#5a7a9a;margin-bottom:8px;font-weight:600;}
.installment-box .inst-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:0.5px solid #cfe0ef;}
.installment-box .inst-row:last-child{border-bottom:none;font-weight:600;font-size:13px;padding-top:6px;}
.btn-row{display:flex;gap:10px;margin-top:20px;}
.print-btn{flex:1;padding:13px;background:#2a2218;color:#fff;border:none;border-radius:10px;font-family:'Jost',sans-serif;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.5px;}
.print-btn:hover{background:#3d3127;}
.share-btn{display:none;flex:1;padding:13px;background:#b5831a;color:#fff;border:none;border-radius:10px;font-family:'Jost',sans-serif;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.5px;}
.share-btn:hover{background:#9a6f15;}
.footer-note{text-align:center;font-size:10px;color:#8a7a6a;margin-top:18px;line-height:1.6;letter-spacing:.3px;}
.social-links{display:flex;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap;}
.social-links a{font-size:11px;color:#8a7a6a;text-decoration:none;border-bottom:1px solid #d4c9bc;padding-bottom:1px;}
.social-links a:hover{color:#b5831a;}
.book-again-btn{display:block;width:100%;margin-top:16px;padding:11px;background:#faf7f3;border:1.5px solid #d4c9bc;border-radius:10px;font-family:'Jost',sans-serif;font-size:13px;font-weight:600;color:#5a4a3a;text-align:center;text-decoration:none;cursor:pointer;}
.book-again-btn:hover{background:#f0ebe4;border-color:#b5831a;color:#b5831a;}
.loading{text-align:center;padding:60px 20px;color:#8a7a6a;font-size:14px;}
.error-box{text-align:center;padding:60px 20px;color:#c0392b;font-size:14px;}
.timeout-box{text-align:center;padding:40px 20px;font-size:13px;color:#5a4a3a;line-height:1.7;}
.timeout-box a{color:#b5831a;}
.retry-btn{margin-top:14px;padding:10px 24px;background:#2a2218;color:#fff;border:none;border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
@media(max-width:480px){
  body{padding:0;}
  .receipt-wrap{border-radius:0;max-width:100%;min-height:100vh;}
  .receipt-body{padding:20px 18px 16px;}
  .brand h1{font-size:24px;}
  .row{font-size:12px;}
  .svc-item{font-size:12px;}
  .total-row{font-size:15px;}
  .btn-row{position:sticky;bottom:0;border-radius:0;gap:0;}
  .print-btn{border-radius:0;}
  .share-btn{display:flex;align-items:center;justify-content:center;border-radius:0;}
}
@media print{
  body{background:#fff;padding:0;}
  .receipt-wrap{box-shadow:none;border-radius:0;max-width:100%;}
  .btn-row,.book-again-btn,.social-links{display:none;}
}
</style>
</head>
<body>
<div class="receipt-wrap" id="receiptWrap">
  <div class="loading" id="loadingState">Loading receipt…</div>
</div>

<script>
const params=new URLSearchParams(location.search);
const receiptId=params.get('id');

const FB_CONFIG={
  apiKey:"AIzaSyAoSdhij_phFCaKQMWca40x6xXD5hhi7vU",
  authDomain:"glowbar-pos-a30e2.firebaseapp.com",
  databaseURL:"https://glowbar-pos-a30e2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"glowbar-pos-a30e2",
  storageBucket:"glowbar-pos-a30e2.firebasestorage.app",
  messagingSenderId:"399292982876",
  appId:"1:399292982876:web:fc21e03399a470ee512899"
};

function fp(n){return '₱'+(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fd(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('en-PH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}catch(e){return d;}}
function fdt(d){if(!d)return'—';try{return new Date(d).toLocaleString('en-PH',{month:'long',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}
function cap(s){return (s||'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}

// stored globally so shareReceipt() can access it after render
let _r = null;

function shareReceipt(){
  if(!_r) return;
  const svcNames = (_r.services||[]).map(s=>s.name).join(', ') || 'Beauty Service';
  const text = `GlowBar Receipt — ${svcNames} | ${fp(_r.totalCharged)} | ${fdt(_r.createdAt)}`;
  const url = location.href;
  if(navigator.share){
    navigator.share({title:'GlowBar Receipt',text,url}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>{
      alert('Receipt link copied to clipboard!');
    }).catch(()=>{
      prompt('Copy this link:',url);
    });
  }
}

function renderReceipt(r){
  _r = r;
  const wrap=document.getElementById('receiptWrap');
  const hasFee=r.payFee>0;
  const hasBalance=r.remainingBalance>0;
  const hasPackage=r.packageInfo&&r.packageInfo.length>0;
  const ii=r.installmentInfo||(r.internalInstallment&&typeof r.internalInstallment==='object'?r.internalInstallment:null);
  const hasInstallment=!!(ii||r.internalInstallment);
  const methodLabel=cap(r.method||'cash')+(r.feeTerm?' ('+r.feeTerm+' months)':'');
  const hasScpwd=r.scpwd&&r.scpwd.discAmt>0;
  const hasBir=r.tin||r.birPermit||r.lguPermit||r.businessAddress;

  // Actual amount collected today (totalCharged minus any outstanding balance)
  const amountPaidToday = r.totalCharged - (r.remainingBalance||0);

  // Services rows
  const svcRows=(r.services||[]).map(s=>`
    <div class="svc-item">
      <span class="svc-name">${s.name}${s.qty>1?' <span style="color:#8a7a6a;font-weight:400;font-size:12px;">×'+s.qty+'</span>':''}</span>
      <span class="svc-price">${fp(s.price*s.qty)}</span>
    </div>`).join('');

  // Payment breakdown
  const payRows=[];
  if(r.surgeAmt>0) payRows.push(`<div class="row"><span class="label">${r.surgeMeta?.label||'Surge'} (+${r.surgeMeta?.pct||0}%)</span><span class="value accent">+${fp(r.surgeAmt)}</span></div>`);
  if(r.disc>0) payRows.push(`<div class="row"><span class="label">Discount</span><span class="value danger">-${fp(r.disc)}</span></div>`);
  if(hasScpwd) payRows.push(`<div class="row"><span class="label">SC/PWD Discount (20%)<br><span style="font-size:10px;">${r.scpwd.type==='SC'?'Senior Citizen':'PWD'} · ID: ${r.scpwd.idNum}</span></span><span class="value danger">-${fp(r.scpwd.discAmt)}</span></div>`);
  if(r.depositApplied>0) payRows.push(`<div class="row"><span class="label">Deposit Applied</span><span class="value success">-${fp(r.depositApplied)}</span></div>`);
  if(hasScpwd){
    payRows.push(`<div class="row" style="font-size:11px;"><span class="label" style="color:#27ae60;">VAT Status</span><span class="value" style="color:#27ae60;font-size:11px;">VAT-Exempt (RA 9994/9442)</span></div>`);
  } else if(r.vat>0){
    payRows.push(`<div class="row"><span class="label">VAT (12%)</span><span class="value">+${fp(r.vat)}</span></div>`);
  } else if(r.vatOn===false){
    payRows.push(`<div class="row" style="font-size:11px;"><span class="label" style="color:#8a7a6a;">VAT Status</span><span class="value" style="font-size:11px;color:#8a7a6a;">VAT-Exempt</span></div>`);
  }
  if(hasFee) payRows.push(`
    <div class="row"><span class="label">Original Amount</span><span class="value">${fp(r.originalAmount)}</span></div>
    <div class="row"><span class="label">Fee (${Math.round(r.feePct*100)}%)</span><span class="value danger">+${fp(r.payFee)}</span></div>`);

  // Package info block
  let pkgBlock='';
  if(hasPackage){
    pkgBlock=r.packageInfo.map(pi=>`
      <div class="divider"></div>
      <div class="section-label">Package Info</div>
      <div class="row"><span class="label">Package</span><span class="value"><span class="badge badge-pkg">${pi.packageName}</span></span></div>
      <div class="row"><span class="label">Sessions Used</span><span class="value">${pi.sessionsUsed}${pi.totalSessions?' of '+pi.totalSessions:''}</span></div>
      <div class="row"><span class="label">Sessions Remaining</span><span class="value accent">${pi.sessionsRemaining}</span></div>`).join('');
  }

  // Installment details block
  let installBlock='';
  if(hasInstallment){
    const visitLabel=ii?.visitNumber?`Visit ${ii.visitNumber}${ii.totalVisits?' of '+ii.totalVisits:''}`:null;
    const schedLabel=ii?.schedule||ii?.paymentSchedule||null;
    installBlock=`
      <div class="divider"></div>
      <div class="section-label">Installment Plan</div>
      <div class="installment-box">
        <div class="inst-label">Payment Schedule</div>
        ${visitLabel?`<div class="inst-row"><span>Payment Number</span><span>${visitLabel}</span></div>`:''}
        ${ii?.amountPerVisit?`<div class="inst-row"><span>Amount per Visit</span><span>${fp(ii.amountPerVisit)}</span></div>`:''}
        ${schedLabel?`<div class="inst-row"><span>Schedule</span><span>${schedLabel}</span></div>`:''}
        ${r.nextPaymentDate?`<div class="inst-row"><span>Next Payment Due</span><span>${fd(r.nextPaymentDate+'T12:00')}</span></div>`:''}
        ${hasBalance?`<div class="inst-row"><span>Remaining Balance</span><span style="color:#c0392b;">${fp(r.remainingBalance)}</span></div>`:''}
        <div class="inst-row"><span>Paid Today</span><span style="color:#b5831a;">${fp(amountPaidToday)}</span></div>
      </div>`;
  }

  // Remaining balance block (shown when no installment block, or always for non-installment)
  let balBlock='';
  if(hasBalance&&!hasInstallment){
    const nextDueTxt=r.nextPaymentDate?fd(r.nextPaymentDate+'T12:00'):null;
    balBlock=`
      <div class="balance-box">
        <div class="bal-label">Outstanding Balance</div>
        <div class="bal-amount">${fp(r.remainingBalance)}</div>
        ${nextDueTxt?`<div class="bal-next">Next payment due: <strong>${nextDueTxt}</strong></div>`:''}
      </div>`;
  }

  wrap.innerHTML=`
    <div class="receipt-header">
      <img src="https://raw.githubusercontent.com/kyliealodia/glowbar-pos/main/images/email-header.jpg" alt="GlowBar" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="receipt-header-fallback">GlowBar Beauty Clinic</div>
    </div>
    <div class="receipt-body">
      <div class="brand">
        <h1>${r.businessName||'GlowBar'}</h1>
        <div class="tagline">Beauty · Confidence · Glow</div>
        ${r.businessAddress?`<div style="font-size:11px;color:#6a5a4a;margin-top:4px;">${r.businessAddress}</div>`:''}
      </div>
      ${hasBir?`<div style="text-align:center;font-size:10px;color:#8a7a6a;line-height:1.8;margin-bottom:12px;">${r.tin?`TIN: ${r.tin}<br>`:''}${r.birPermit?`BIR Permit: ${r.birPermit}<br>`:''}${r.lguPermit?`LGU Permit: ${r.lguPermit}`:''}
      </div>`:''}

      <div class="receipt-num">
        <div class="rnum">${r.orNumber?'OR No. '+r.orNumber+' · ':''}Receipt ${r.id}</div>
        <div class="rdate">${fdt(r.createdAt)}</div>
      </div>

      <hr class="divider">

      <div class="section-label">Client</div>
      <div class="row"><span class="label">Name</span><span class="value">${r.clientName||'Walk-in Client'}</span></div>
      <div class="row"><span class="label">Served by</span><span class="value">${r.staff||'—'}</span></div>

      <hr class="divider">

      <div class="section-label">Services Availed</div>
      ${svcRows}

      <hr class="divider">

      <div class="section-label">Payment</div>
      <div class="row"><span class="label">Method</span><span class="value"><span class="badge badge-method">${methodLabel}</span></span></div>
      ${payRows.join('')}

      <div class="total-row">
        <span class="total-label">Total Charged</span>
        <span class="total-val">${fp(r.totalCharged)}</span>
      </div>

      <div class="row" style="margin-top:8px;"><span class="label">Amount Paid Today</span><span class="value accent">${fp(amountPaidToday)}</span></div>

      ${pkgBlock}
      ${installBlock}
      ${balBlock}

      <hr class="divider">

      <div class="footer-note">
        Thank you for visiting ${r.businessName||'GlowBar'}!<br>
        ${hasScpwd?`<span style="font-size:9px;">SC/PWD Discount applied per RA 9994/RA 9442. ID verified.</span><br>`:''}
        Receipt ID: ${r.id}${r.orNumber?' · OR No. '+r.orNumber:''} · Ref: ${r.txId||''}
      </div>

      <a class="book-again-btn" href="GlowBar_Booking.html">✦ Book Again</a>

      <div class="social-links">
        <a href="https://instagram.com/glowbarph" target="_blank">Instagram</a>
        <a href="https://m.me/glowbarph" target="_blank">Messenger</a>
        <a href="mailto:hello@glowbarph.com">hello@glowbarph.com</a>
      </div>

      <div class="btn-row">
        <button class="share-btn" onclick="shareReceipt()">Share Receipt</button>
        <button class="print-btn" onclick="window.print()">🖨 Print Receipt</button>
      </div>
    </div>`;
}

function showError(msg){
  document.getElementById('receiptWrap').innerHTML=`<div class="error-box"><div style="font-size:32px;margin-bottom:12px;">⚠️</div><strong>Receipt not found</strong><br><span style="font-size:12px;color:#8a7a6a;margin-top:6px;display:block;">${msg||'This receipt may have expired or the link is invalid.'}</span></div>`;
}

function showTimeout(){
  document.getElementById('loadingState').className='timeout-box';
  document.getElementById('loadingState').innerHTML=`
    <div style="font-size:28px;margin-bottom:12px;">⏱</div>
    <strong>Receipt is taking longer than usual to load.</strong><br>
    Please check your connection or contact us at<br>
    <a href="mailto:hello@glowbarph.com">hello@glowbarph.com</a>
    <br><button class="retry-btn" onclick="location.reload()">Retry</button>`;
}

if(!receiptId){
  showError('No receipt ID provided in the URL.');
} else {
  try{
    firebase.initializeApp(FB_CONFIG);
    const db=firebase.database();
    let timedOut=false;
    const loadTimer=setTimeout(()=>{ timedOut=true; showTimeout(); },8000);
    db.ref('gb/receipts/'+receiptId).once('value').then(snap=>{
      clearTimeout(loadTimer);
      if(timedOut) return; // user already sees timeout UI
      if(!snap.exists()){showError('Receipt '+receiptId+' was not found.');return;}
      renderReceipt(snap.val());
    }).catch(e=>{
      clearTimeout(loadTimer);
      if(timedOut) return;
      showError('Failed to load receipt: '+e.message);
    });
  }catch(e){
    showError('Unable to connect: '+e.message);
  }
}
</script>
</body>
</html>
